[package]
name = "dual-pet"
version = "0.2.0"
description = "Dual Pet for Windows"
authors = ["you"]
edition = "2021"

[lib]
name = "dual_pet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"


