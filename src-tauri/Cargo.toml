[package]
name = "dual-pet"
version = "0.3.0"
description = "Dual Pet desktop companions for Windows and macOS"
authors = ["you"]
edition = "2021"

[lib]
name = "dual_pet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri's manifest validator requires managed features on this dependency.
# macos-private-api is inert on Windows; native integration stays cfg(macos).
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
fastrand = "2.5"
